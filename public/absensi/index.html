<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#ffffff"><title>Absensi ARTA</title><link rel="stylesheet" href="style.css?v=2"><script src="config.js?v=2" defer></script><script src="app.js?v=2" defer></script></head>
<body><main class="app"><header><h1 id="today">Absensi ARTA</h1><span>WIB</span></header><div id="notice" class="notice" role="status" hidden></div><form id="attendance"><fieldset id="fields"><legend class="sr-only">Absensi ARTA</legend><label class="field-label">Lokasi kerja</label><div class="segments"><label><input type="radio" name="mode" value="WFO" required><span>WFO · Kantor</span></label><label><input type="radio" name="mode" value="WFA" required><span>WFA</span></label></div><label class="field-label">Jenis absensi</label><div class="segments"><label><input type="radio" name="action" value="in" checked><span>Masuk</span></label><label><input type="radio" name="action" value="out"><span>Pulang</span></label></div><label class="field-label" for="name">Nama staff</label><div class="staff-picker"><input id="name" name="name" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="staff-options" autocomplete="off" placeholder="Memuat daftar staff…" required disabled><ul id="staff-options" role="listbox" aria-label="Nama staff" hidden></ul></div><button id="reload-staff" class="text-button" type="button" hidden>Muat ulang daftar staff</button><div id="location-field" hidden><label class="field-label" for="location">Lokasi WFA</label><input id="location" name="location" maxlength="120" placeholder="Contoh: Rumah — Yogyakarta"></div><label class="field-label">Foto diri <span>Wajib</span></label><div class="camera-box"><div id="camera-placeholder"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6h4l2-3h4l2 3h4v14H4z"/><circle cx="12" cy="12" r="4"/></svg><p>Ambil foto langsung dari kamera.</p></div><video id="camera" autoplay muted playsinline hidden aria-label="Pratinjau kamera depan"></video><img id="preview" alt="Foto absensi yang baru diambil" hidden></div><div class="camera-actions"><button id="open-camera" type="button" class="secondary">Buka kamera</button><button id="capture" type="button" class="secondary" hidden disabled>Ambil foto</button><button id="cancel-camera" type="button" class="text-button" hidden>Tutup kamera</button></div><p id="camera-status" class="help" role="status">Foto wajib saat masuk dan pulang.</p><button class="submit" id="submit" type="submit" disabled>Kirim absen masuk</button><p class="help footnote">Tanggal dan jam otomatis dicatat saat kiriman diterima.</p></fieldset></form><section id="success" hidden aria-live="polite"><div class="check">✓</div><h2 id="success-title">Absensi tercatat</h2><p id="receipt"></p><button id="again" class="submit" type="button">Kembali</button></section><div id="error" class="error" role="alert" hidden></div></main></body></html>
